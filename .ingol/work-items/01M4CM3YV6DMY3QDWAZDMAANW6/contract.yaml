acceptance:
  - id: WI28-AC01
    description: >
      An answer whose usage costs more than the most its request was
      estimated to cost is returned and kept (paid-answers), and the next
      request of the same run, in the same stage or a later one, a retry
      included, is not sent: the run fails naming the estimate that fell
      short (what was estimated, what it cost). The review's own case (an
      answer of 800,000 input tokens with a ceiling of US$0.50 and an
      estimate of US$0.10) is one of the tests. An answer that cost what was
      estimated or less changes nothing; the same meeting processed again
      reuses the kept answer and pays nothing for it.
  - id: WI28-AC02
    description: >
      The application's form, its run page and the README call the ceiling
      an estimated ceiling and say, in English and Spanish, that it comes
      from list prices, that a request already sent is paid even if refused,
      and that a run stops if an answer cost more than estimated; the
      module's docstring says the same. No text calls it a guarantee.
  - id: WI28-AC03
    description: >
      Mutations (the stop after an estimate fell short removed; the overrun
      compared against the ceiling instead of against the request's
      estimate; the kept answer not written when it overran) each make a
      test fail; the script and its output in the evidence. A known
      limitation for the model alias and the fixed prices, reproduced. An
      independent review through INGOL's mailbox before the pull request;
      the whole suite passes in a fresh clone of the tested commit with
      INGOL's kits, output committed under
      docs/evidence/01M4CM3YV6DMY3QDWAZDMAANW6/; tests changed named with
      why.
