acceptance:
  - id: WI200-AC01
    description: >
      The summary request no longer makes the model invent. For a presale
      meeting it says that the screens our side shows are our product and
      their figures are demo data unless the client says they are theirs; the
      client's problems are only the ones said (one nobody said goes to
      "Beyond the agenda", as our reading); a cost is written only if it was
      said, otherwise "not stated"; a deadline is written as it was said or
      "not set", never "implied"; the sales signals ask for the stages of the
      purchase, who approves each, when price is discussed, which documents
      the client asks for, their success criteria and how they see us against
      the alternatives; a screen of our own demo is named only when the client
      made an important comment about what it showed, and its observation says
      what the client said or did; nothing personal is a deliverable; the
      reading between the lines of the role is kept for "Beyond the agenda".
      The request carries the meeting's date and weekday. Covered by tests on
      the request (tests/test_resumen_fiel.py).
  - id: WI200-AC02
    description: >
      In "Client problems", "Sales signals" and "Key points" (and their Spanish
      headings), a figure that neither the transcript nor the notes say is
      written in the report as [VERIFICAR: «…»] in red and bold, and does not
      refuse the summary. A figure the transcript says, in digits or in words
      as the 1.0.0 register reads them, is left as it is. The other sections
      are not checked. Covered by tests/test_resumen_fiel.py and
      tests/test_verificar_rojo.py.
  - id: WI200-AC03
    description: >
      A meeting can carry one optional notes file (.docx or .txt) and the name
      of who took them, from the application and from the command line. The
      notes are kept with the meeting in the data folder, never in the
      repository, and go into the request after the material marker, labelled
      as notes that may cover what was not recorded and may hold the note
      taker's own research or mistakes. With notes, the summary must have the
      section "Recording and notes" (Spanish "Grabación y notas") with each
      disagreement as topic, recording with its minute, notes, and what to
      confirm, or one line saying there was none; without notes the section is
      not asked for. What only the notes say carries "(according to <name>'s
      notes)". Notes are data, not instructions: a notes file that orders the
      model to ignore its instructions leaves the request's instructions
      unchanged and is checked by a test. An empty notes file, one over the
      upload limit, one in another text encoding, a .docm, and a .docx that
      links outside content are refused or read as plain text, never fetched
      or run. Covered by tests/test_notas.py and tests/test_app.py.
  - id: WI200-AC04
    description: >
      The summary carries one line of fixed form saying whether the recording
      is complete, starts mid-conversation, ends mid-conversation, or both. The
      program reads it, takes it out of the text, and, unless complete, the
      Word report opens with a notice saying that what was said before (or
      after) is not in the summary, and, with notes, "except what the notes
      bring". A summary without that line, or with another value, is refused
      like a missing section and retried once with a note saying why. Covered
      by tests/test_resumen_fiel.py.
  - id: WI200-AC05
    description: >
      Setting a company template that has text after its cover and neither
      {informe} nor a table of contents keeps it and warns in Settings that
      that text will be copied into every report and how to mark where the
      report starts. A template with {informe} or a table of contents shows no
      such warning. Covered by tests/test_template.py (or the existing
      template tests).
  - id: WI200-AC06
    description: >
      Settings and the foot of the window show "VisualMeetingTool 2.0.0", read
      from meetingtool.__version__, which is "2.0.0". Covered by
      tests/test_app.py.
  - id: WI200-AC07
    description: >
      The project's page shows its context and lets it be changed, with a short
      guide of what to write (who we are and who the client is, what we want to
      sell or do, what must be known to read the meetings right). The change is
      saved in project.json and the project's knowledge is rebuilt with it; the
      text is shown escaped and is bounded in length. Covered by
      tests/test_app.py and tests/test_projects.py.
  - id: WI200-AC08
    description: >
      The real presales meeting of 2026-11-05, kept in the data folder with its
      notes, is processed twice with the committed tree, and an agent that did
      not build the change judges each run against the nine points of the
      proposal's checklist (no demo figure as the client's; no invented cost or
      deadline, "today or tomorrow" as 5 or 6 November; the committee as who
      approves; price, ROI document, committee meetings and the remark that
      every vendor on the list can do it; disagreements with the notes shown;
      what only the notes say with its origin; the incomplete recording notice;
      no template sample text; no selling observation, no personal deliverable
      and no demo screen without an important client comment). Both runs pass
      every point. Only the verdict per point, in neutral words, is committed
      under docs/evidence/01M7B76KPE7XJMKQ2820C15Z9H/; the outputs stay in the
      data folder.
  - id: WI200-AC09
    description: >
      The whole suite passes on the committed tree, with only the tests that
      need INGOL's test kits skipped. Output committed under
      docs/evidence/01M7B76KPE7XJMKQ2820C15Z9H/local-test-run.txt.
  - id: WI200-AC10
    description: >
      The installer VisualMeetingTool-Setup-2.0.0.exe, compiled from the
      committed tree, installs silently without administrator rights into a
      folder given by /DIR with exit code 0. The build record, with the commit
      and the SHA-256, is committed under
      docs/evidence/01M7B76KPE7XJMKQ2820C15Z9H/installer-build.txt.
  - id: WI200-AC11
    description: >
      The user manual explains the notes and who took them, the "Recording and
      notes" section, the [VERIFICAR] marks in the summary, the incomplete
      recording notice, the template warning, the editable context and where
      the version is shown; docs/MAINTAINING.md names the new functions and the
      notes as untrusted input, and its guide check passes.
