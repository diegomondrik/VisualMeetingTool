schema_version: "1"
id: 01M7B76KPE7XJMKQ2820C15Z9H
objective: >
  Release version 2.0.0 of MeetingTool, as approved by the owner on 2026-11-13
  in docs/proposals/2.0.0-resumen-fiel-y-notas-proposal.md. A real presales
  meeting processed with 1.0.0 showed that the summary turns the figures of our
  own demo (synthetic data) into the client's problems, invents costs and
  deadlines, does not say that the recording started mid-conversation, misreads
  who approves the purchase, and that a company template without {informe}
  copies its sample text into every report. Seven changes go together:
  (1) the summary stops inventing: the presale guides keep our demo apart from
  the client's data, no longer ask for problems nobody said, write a cost or a
  deadline only as it was said, ask for the buying process, and name a screen
  of our own demo only when the client made an important comment about what it
  showed; the request carries the meeting's date with its weekday;
  (2) a figure in the client's problems, the sales signals or the key points
  that neither the transcript nor the notes say is written in the Word report
  as [VERIFICAR: «…»] in red and bold, never a reason to refuse the meeting
  (the owner's decision of 1.0.0, confirmed for 2.0.0);
  (3) the notes of a participant, optional, as a second source with who took
  them: what only the notes say carries its origin, and where notes and
  recording disagree a section "Recording and notes" shows both;
  (4) the summary says, in one line of fixed form, whether the recording seems
  to start or end mid-conversation, and the report then opens with a notice;
  (5) Settings warns when a template has text after its cover and neither
  {informe} nor a table of contents;
  (6) the version is shown in Settings and at the foot of the window;
  (7) the project's context can be read and edited in the application.
  No client data enters the repository: the real meeting is kept in the data
  folder and only its pass or fail per checklist point is committed.
lane: standard
