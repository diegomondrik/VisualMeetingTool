schema_version: "1"
id: 01M3QPZT9YPTVTYSED4GF7YDD3
objective: >
  The application on the owner's machine, the first of the three jobs that
  finish MeetingTool (INGOL D-185, approving
  docs/work-items/f8-owner-project/finish-app-plan-proposal.md of INGOL). Today
  everything works only from a terminal, in five commands run in order; the
  owner asked to see his projects and meetings on his machine, and to process a
  meeting without them.

  A new command, `meetingtool app` (also `python -m meetingtool app`), starts a
  web server that only this machine can reach and opens the browser on it. It
  has five screens, in Spanish: the projects (the list, creating one with name
  and client, and the result folders of the data folder that belong to no
  project, shown read-only); a project (its meetings by date with type and
  format, and what the project knows); a meeting (the summary or the
  question-and-answer register on screen, the frames it names, the Word report
  to open or download, and what it cost); a new meeting (the transcript, and
  the recording if there is one, uploaded from the browser; title, date, type,
  language, format and spending ceiling; a "Procesar" button); and the settings
  (saving, replacing or deleting the Gemini key, never shown back; the
  company's Word template).

  "Procesar" runs the same functions as the commands, in order: the frames of
  the recording (only with a recording), their reading (only for the summary,
  which needs it), the summary or the register with what the project knows,
  and the Word report. The page shows the stage it is in, the time and what
  was spent. One ceiling covers the whole run: each stage is given what the
  ones before it left. Nothing is added to the project until the Word report
  is built and opened again: if a stage fails, the meeting does not appear in
  the project and its working folder is removed; the page says which stage
  failed, why, and what was spent. A processed meeting keeps, in its own
  folder inside the project, its frames, transcript, summary, Word report and
  a record of the run (stages, cost, model); its record in the project names
  that folder. The recording itself is not kept: its frames are.

  Only this machine: the server listens on 127.0.0.1 only and refuses a
  request whose peer is not a loopback address. A page of another site open
  in the same browser cannot use it: every request needs a cookie the server
  sets when the browser opens the launch address (a random token, new at each
  start, SameSite=Strict, HttpOnly); a request whose Host is not the server's
  own address (a DNS rebinding) is refused, as is one whose Origin is another,
  or whose Sec-Fetch-Site says it comes from another site. Changes (processing,
  uploading, creating, the key, the template) are only accepted as JSON or raw
  uploads with a custom header, which a page of another site cannot send
  without the server's consent, never given. Pages forbid being framed and
  run no inline script. Paths come only from identifiers checked as slugs,
  never from the request.

  The commands are unchanged: without `meetingtool app` everything works as
  before. The summary and the register accept a way to record the meeting in
  the project later instead of at once (the default is at once, as today); the
  reading, the summary and the register accept one spending meter shared by
  all three, so that a single ceiling covers them together and what was spent
  is known when one fails (the default is a meter of their own, as today); and
  a meeting record may name its folder (records without one are read as
  before, and a meeting added from the terminal has none).

  Not done: the installer (WI16) and the team's guide (WI17); sharing a
  project between people (each sees his own, on his machine); using it from a
  phone or another machine; changing how summaries are written; reusing, on a
  second try, what a failed run already paid for (the command line keeps the
  register's paid batches and can reuse them; the application removes the
  failed run's folder); cancelling a run once started; progress within a
  stage.
lane: standard
