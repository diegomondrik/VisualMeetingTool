acceptance:
  - id: WI15-AC01
    description: >
      The five screens work with invented projects and meetings: each is
      requested from a running server and shows what it must (projects and
      loose result folders; a project's meetings in date order and its
      knowledge; a meeting's summary or register with its frames, the Word
      report and the cost; the new-meeting form; the settings with whether a
      key is saved, never the key). Creating a project, saving and deleting a
      key and setting a template work from the page. No network, no key.
  - id: WI15-AC02
    description: >
      A request from another machine, or from a page of another site, is
      refused, and tests attempt it: the server listens only on 127.0.0.1 (a
      connection to another address of the machine fails); a request from a
      non-loopback peer, with no cookie or a wrong one, with another Host
      (DNS rebinding), with another Origin, or with Sec-Fetch-Site cross-site
      or same-site, is refused with nothing read or changed; a change sent as
      a form is refused; the launch address with a wrong token sets no
      cookie.
  - id: WI15-AC03
    description: >
      "Procesar" runs the stages in order (frames, reading, summary or
      register, Word), shows the stage and what was spent while it runs, and
      ends with the meeting in its project and its Word report built; with
      the fake Gemini, a failure in each stage leaves no meeting in the
      project and no working folder, says which stage failed and what was
      spent; the whole run keeps under one ceiling; the request sent to Gemini
      is the one the command sends for the same meeting and project.
  - id: WI15-AC04
    description: >
      The owner's existing data folder is shown as it is, with no migration:
      a local run of the application over
      C:/Users/Diego/VisualMeetingTool-data, with no key and no spend, lists
      its projects and its loose result folders and opens each; every file of
      the folder has the same bytes before and after (hashes compared, only
      counts recorded).
  - id: WI15-AC05
    description: >
      One real run from the window: the owner processes one of his meetings
      with his paid key and a ceiling of US$0.50 (INGOL D-182), sees the Word
      report, and says whether the application is understood. Recorded under
      docs/evidence/01M3QPZT9YPTVTYSED4GF7YDD3/ as numbers only (stages,
      seconds, cost, frames); the meeting's content stays in his data folder.
  - id: WI15-AC06
    description: >
      Without `meetingtool app` everything stays the same: the whole suite
      passes with `python -m unittest discover -s tests -v` in a fresh clone
      of the tested commit on the owner's machine, with the existing tests
      unchanged, and its complete output is committed under
      docs/evidence/01M3QPZT9YPTVTYSED4GF7YDD3/ before the pull request
      (INGOL D-163); importing meetingtool and its entry point still needs
      only the standard library.
