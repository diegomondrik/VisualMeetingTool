acceptance:
  - id: WI27-AC01
    description: >
      The line of the owner's meeting ("- **Outlier Treatment Mechanics**
      [frame_029_t00-23-24.jpg, frame_037_t00-31-24.jpg]: ...") is accepted
      and saved with one pair of brackets per frame, and the report built
      from that summary shows both frames; the same with three names, with
      ";", "y", "e", "and" and ", and", and with the names in backticks or
      bold as the single names are accepted today.
  - id: WI27-AC02
    description: >
      Still refused, naming the case: a list with a name that does not
      exist; a list with an item that is not a whole frame name; a range
      inside one pair ("[a – b]", "[a to b]", "[a a b]", "[a..b]"); a frame
      named without brackets. A single name, and the summaries the tests
      accept today, come out unchanged.
  - id: WI27-AC03
    description: >
      A summary refused as a range or as a frame without its own brackets is
      retried with a note saying what was refused and to name each frame in
      its own brackets; with another refusal in the same answer the note
      lists both (as in WI25); the note stays within RETRY_NOTE_CHARS.
  - id: WI27-AC04
    description: >
      Mutations (the rewriting switched off; a list split across a range
      word; the two new retry notes removed) each make a test fail; the
      script and its output in the evidence. An independent review through
      INGOL's mailbox before the pull request; the whole suite passes in a
      fresh clone of the tested commit with INGOL's kits, output committed
      under docs/evidence/01M4CB9FV6XGEYENDJYAEQZWQX/; tests changed named
      with why; known limitations reproduced.
