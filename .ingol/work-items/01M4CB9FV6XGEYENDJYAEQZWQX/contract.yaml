schema_version: "1"
id: 01M4CB9FV6XGEYENDJYAEQZWQX
objective: >
  WI27. A summary that names several frames inside one pair of square
  brackets is taken, not refused; and a summary refused for how it names a
  frame is retried saying why. Found by the owner's second real meeting
  ("Statistical Script Review - part 2", 2026-10-07): Gemini wrote
  "[frame_029_t00-23-24.jpg, frame_037_t00-31-24.jpg]", the summary was
  refused ("the summary mentions a frame without its file name in square
  brackets"), the retry sent the very same request, got the same mistake, and
  the run failed after paying US$0.157 for two summaries. Approved by the
  owner on 2026-10-07; starts from main (f1bde92, after WI26); does not touch
  the installer's branch.

  Today the report reads one frame name per pair of brackets, so a list in
  one pair would leave its frames out of the report; the check refuses it,
  which is right, but nothing in the request tells Gemini what went wrong.
  After this work item: one pair of brackets holding two or more frame
  names, each written whole and separated by a comma, a semicolon, "y",
  "e" or "and" (alone or after a comma), is rewritten as one pair per name,
  in the same order, before the summary is checked; the summary saved and
  the report then read each frame on its own. Everything else is checked as
  today: a name that does not exist, a range (also one written inside a
  pair, "[a – b]", which the rewriting does not split) or a list with any
  item that is not a whole frame name is still refused. The two refusals
  about how a frame is named (a range; a frame without its own brackets)
  get a retry note, as the nonexistent frames got in WI24 and the empty
  sections in WI25: what was refused and what to write instead.

  Built by a construction-role agent (Sonnet), gated by the criterion; one
  independent review through INGOL's mailbox.

  Not done: the questions-and-answers format names frames from its own
  register, not from Gemini's text, and is not touched; the report's own
  check (document.cited_frames) is left as it is: it reads the summary
  already rewritten.

  Corrected after the independent review of d549b2d
  (docs/evidence/01M4CB9FV6XGEYENDJYAEQZWQX/independent-review.md): what
  separated the names stays between the pairs, so "entre [a y b]" is still
  refused as a range (P1); the note for a frame without its own brackets
  also says never a range. Known limitation (docs/limitations/REGISTER.md,
  WI27-P3-1): a range of two written with a comma before its last word,
  "between [a, and b]", is not taken as a range, as it was not before with
  each name in its own pair.
lane: standard
