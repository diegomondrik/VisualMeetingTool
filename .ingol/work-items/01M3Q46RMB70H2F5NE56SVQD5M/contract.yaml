schema_version: "1"
id: 01M3Q46RMB70H2F5NE56SVQD5M
objective: >
  A question-and-answer register of a meeting, question by question, with
  each answer in detail (INGOL, session 116's proposal, approved by the owner
  in session 117). The owner read the summary of the second Cermaq meeting
  (the session of doubts of 2026-09-25): it grouped 29 questions and 4 topics
  that came up in the conversation into six themes and lost the detail of each
  answer, and it showed screens that did not matter. What a consultant needs
  to design from such a meeting is the complete answer to every question.

  A new option of the summary, --format qa, that combines with every meeting
  type and both languages; without it the summary is exactly as before. The
  questions are found in the conversation: no list is given. Each one carries
  what was asked and who raised it (if known), the complete answer with who
  gave it, the minutes, the agreement if any, what is pending, the deadline as
  it was said (or "no date said") and a status: resolved, resolved with a
  caveat, pending or out of scope. After the questions, the project's
  knowledge grouped: agreed rules, who owns and who loads each piece of data,
  figures said, glossary and scope; then the pending items of every question.

  Each answer says whether it was only verbal or relied on something shown on
  screen, judged by what is said in the conversation ("te muestro", "¿están
  viendo?"), with the verbatim words that show it. Only answers on screen
  look for images: the frames of that answer's span are read, and only those,
  and what they show is added to the answer apart from what was said. The
  span of an answer is the frame on screen when it began (the last one the
  extraction kept before it, at most five minutes before: a frame is kept when
  the screen changes, not while it stays the same) and the frames kept until
  its last turn began, at most ten minutes after it began (an answer taken up
  again much later keeps its question's minutes, and its frames are not
  looked for in everything between). The owner's rule for frames (D-181) decides which ones
  are named. With no answer on screen no frame is read and nothing is paid for
  it; with no frames at all (only the transcript), an answer on screen says
  "no image available" and nothing seen is invented. The order changes: the
  transcript first, then only the frames some answer needs; the full reading
  of the frames is not needed and not used.

  Gemini answers in JSON and the program writes the Markdown the Word report
  reads, so what is checked is what is delivered. Checked against the
  transcript, and refused like an incomplete summary (retried once, then not
  delivered): a verbatim fragment of each answer that was not said between
  its minutes, two minutes wider on each side (or has fewer than five words);
  an answering speaker (or a named asker) who did not speak; a minute outside
  the meeting or an answer ending before it starts; a status that is not one
  of the four; a written date (a day with its month, or a day/month after a
  word that introduces a date, or with its year) that the transcript does not
  say, days said in Spanish words included; an answer marked on screen
  without words that show it said between its minutes, the same way; what
  was seen given to an answer that is not on screen with frames, or naming a
  frame outside its span. The retry says why the answer before was refused.
  A long transcript is asked in two batches, each registering the questions
  raised in its half with the whole transcript as context; a question a
  batch registers outside its half is left out, since the other batch
  registers it.

  The run fits its budget: with two batches of a transcript like Cermaq's,
  twenty frames read and what was seen, every attempt reserved at its worst
  fits US$0.50 together (the reading of a few frames reserves an output cap
  in proportion to them, not that of seventy). Corrected after the
  independent review of e1649d6 (P1-1, P2-2 to P2-6, P3-7, P3-8, P3-10).

  Not done: following questions across meetings; knowing whether every
  question was found (coverage is measured once against the owner's hand-made
  Word of the Cermaq meeting, not checked by the code); a screen shared in
  silence (the answer stays verbal); changing which frames the extraction
  keeps; checking that "on screen" is right (Gemini judges it); turning
  "next week" into a date (only written dates are checked); what is said
  after the farewell (Gemini is asked to leave it out; the code does not check
  it); job titles and roles (Gemini is asked not to state one nobody said;
  not checked by the code); a transcript without speaker names ([HH:MM:SS]
  lines), where no speaker can be checked.

  Known limitations (independent review of e1649d6): four meeting types
  (kickoff, status, technical, training) have no stance, so with them the
  register's request is the same as with no type (P3-9); a date written only
  as day/month with no introducing word is not checked, nor are days said in
  English words (P2-5, what remains); an answer's minutes are Gemini's, so a
  fragment said just outside them, beyond the margin, is refused (P2-6, what
  remains); a question taken up again in the second batch keeps only what the
  first batch registered of it (P2-4); the final frame check runs after
  every request was paid, outside the retry (P3-12); a run that stops prints
  the total spent, not the cost of each stage (P3-13).
lane: standard
