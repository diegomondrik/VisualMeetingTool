acceptance:
  - id: WI14-AC01
    description: >
      Without --format qa, the request and the summary of every meeting type
      (and none), in Spanish and in English, are exactly as before: the
      request built for each is byte for byte the one built by main at
      cebd990, and the existing tests pass unchanged.
  - id: WI14-AC02
    description: >
      With --format qa, for every meeting type (and none) and both
      languages, with no list of questions given, a register is delivered
      question by question with the fields above and the project's knowledge
      grouped, in the language asked; a meeting type adds its stance to the
      request.
  - id: WI14-AC03
    description: >
      Each check above refuses what it must and accepts a good register: for
      each, a register breaking only that check is retried once and then not
      delivered, naming the problem, and nothing is written; the same checks
      pass on a correct register.
  - id: WI14-AC04
    description: >
      The Word report builds from the register with the questions one by one
      and the knowledge grouped; only answers on screen carry what was seen,
      marked apart, with their frames; Word opens it. Local, no spend.
  - id: WI14-AC05
    description: >
      With no answer on screen no frame is read: a meeting where every
      answer is verbal, and a run with no frames at all, send no reading
      request (counted at the fake Gemini: zero).
  - id: WI14-AC06
    description: >
      With answers on screen, only the frames within their spans are read,
      once each, and what was seen is marked as such; a case of each kind:
      frames read and named, frames read and none worth naming, and on
      screen with no image available.
  - id: WI14-AC07
    description: >
      One real run on the Cermaq meeting of 2026-09-25 with the owner's paid
      key, --format qa, requirements type, in Spanish, ceiling US$0.50 (INGOL
      D-182), on a copy of that meeting's frames in a new folder of his data
      folder (his earlier summaries and the project prueba-resumen-gemini are
      not touched). Passes if it covers at least 24 of the 29 questions of
      the owner's hand-made Word, invents no date or job title, and does not
      group by themes again. Recorded under
      docs/evidence/01M3Q46RMB70H2F5NE56SVQD5M/ as numbers, question ids and
      minutes only; the owner reads the result.
  - id: WI14-AC08
    description: >
      That run reports how many of the 75 frames were read, which answers
      were marked on screen (for the owner to judge), and the cost of each
      stage, so the cost with the selective reading can be set against the
      full reading already paid for this meeting.
  - id: WI14-AC09
    description: >
      The whole suite passes with `python -m unittest discover -s tests -v`
      in a fresh clone of the tested commit on the owner's machine, and its
      complete output is committed under
      docs/evidence/01M3Q46RMB70H2F5NE56SVQD5M/ before the pull request
      (INGOL D-163).
