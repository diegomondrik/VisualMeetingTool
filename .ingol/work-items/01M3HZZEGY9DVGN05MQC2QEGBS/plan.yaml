evaluations:
  - criterion: WI11-AC01
    method: deterministic
    control: >-
      tests/test_report.py BuildTest on an invented summary and frames.
  - criterion: WI11-AC02
    method: deterministic
    control: >-
      tests/test_report.py ImagesTest compares the sha256 of every image in
