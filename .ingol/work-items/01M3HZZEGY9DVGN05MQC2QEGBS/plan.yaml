  - criterion: WI11-AC04
    method: adversarial
    control: >-
      tests/test_report.py CompletenessTest drops an image, drops a section
      and adds an image during the build; with check_report made to pass
      always, or its section or image comparison removed, a test fails,
      recorded in mutations.txt.
  - criterion: WI11-AC05
    method: deterministic
    control: >-
      tests/test_report.py NoNetworkNoKeyTest patches socket to refuse and
      probes the modules the command loads.
  - criterion: WI11-AC06
    method: adversarial
    control: >-
      tests/test_report.py TemplateTest with an invented company's template
      built at test time; with the .dotx content-type fix removed, or the
      cover kept out, a test fails, recorded in mutations.txt.
  - criterion: WI11-AC07
    method: adversarial
    control: >-
      tests/test_report.py TemplateRefusalTest; with the macro check removed a
      test fails, recorded in mutations.txt.
  - criterion: WI11-AC08
    method: external-evidence
    control: >-
      Build the report on the owner's summary of D-167 with the neutral design
      and with an invented company's template, open each with Word through
      COM, export nothing to the repository, and commit only the numbers.
  - criterion: WI11-AC09
    method: deterministic
    control: >-
      Run `python -m unittest discover -s tests -v` in a fresh clone of the
      tested commit and commit its full output, exit code and commit under
      docs/evidence/01M3HZZEGY9DVGN05MQC2QEGBS/.
