evaluations:
  - criterion: WI13-AC01
    method: adversarial
    control: >-
      tests/test_summary.py NamedFramesTest on the request built for Gemini
      and on the request sent to the fake Gemini on localhost; with the rule
      left out, the on-screen guide asking again for each relevant frame, or
      the rule losing the transitions and empty rows, a test fails, recorded
      in mutations.txt.
  - criterion: WI13-AC02
    method: adversarial
    control: >-
      tests/test_summary.py NamedFramesTest (including the parity test
      against meetingtool.report.document.cited_frames, extended with every
      range and non-range case) and tests/test_report.py RefusalTest; with
      the range check removed from the summary or the report, a connector
      dropped from the pattern, bold names or "y" read as a range, a test fails,
      recorded in mutations.txt.
  - criterion: WI13-AC03
    method: deterministic
    control: >-
      existing_summaries_check.py and its output existing-summaries-check.txt:
      the check run on the five real summaries with no request; only counts and the verdicts are recorded.
  - criterion: WI13-AC04
    method: external-evidence
    control: >-
      One real run with the owner's paid key, --type requirements --language
      es, first --max-cost 0.15 (stopped before its retry) and then
      --max-cost 0.50 (INGOL D-182), on a copy of D-178's frames folder; the frames it
      names listed by minute and compared with the five cases; the Word
      report built and opened by Word; commit only numbers and minutes.
  - criterion: WI13-AC05
    method: deterministic
    control: >-
      python -m unittest discover -s tests -v in a fresh clone of the tested
      commit; complete output committed.
