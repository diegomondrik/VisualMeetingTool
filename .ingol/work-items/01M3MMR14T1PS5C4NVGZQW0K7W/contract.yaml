schema_version: "1"
id: 01M3MMR14T1PS5C4NVGZQW0K7W
objective: >
  The summary names only the screens worth showing, and so the Word report
  shows only those (INGOL decision D-181, the owner's first judgement of the
  requirements report of D-178). Every frame the summary names goes into the
  report; until now the request asked for "each relevant frame" and never
  said what is relevant, and the owner found five images that should not be
  there: a file explorer, an Outlook invitation the summary itself called a
  detour, a frame repeating the one before with another zoom, rows without
  data in a transition, and a frame without its column headings where the
  same four minutes held better ones. The last two were the two ends of a
  range the summary named ("frame 48 to frame 72"), which the report showed
  as two images nobody chose.

  The owner's rule goes into the request for every type and language, before
  the sections: name a frame only if it shows information someone would
  otherwise have to write down by hand, and that reading the image gives
  faster (a data model, a spreadsheet's structure, the values discussed),
  and only if that was why the screen was shared; never navigation or a
  detour (file explorer, email, calendar, desktop, loading screen, a
  transition, rows or areas without data, people on camera), which may be
  described in words without naming the frame; one frame for each distinct
  thing shown, the one that shows it best (headings and the values discussed
  visible, least empty area); each frame on its own, never a range. The
  guide of the on-screen section points to the rule instead of asking for
  each relevant frame.

  Two frames named as a range ("[a] a [b]", "desde [a] hasta [b]",
  "entre [a] y [b]", "[a] to [b]", a dash or an ellipsis between them) are
  refused like a missing frame: the summary is retried once and then not
  delivered, and the report refuses to build from it. The pattern is
  written once, in the summary module, and the report uses it, so the two
  keep agreeing. Two frames named one after the other ("[a] y [b]") are not
  a range.

  Found by the first real run (WI13-AC04): Gemini's first answer was
  refused, the retry did not fit the budget of US$0.15 (one attempt is
  reserved at its worst, about US$0.12), and the stop did not say what
  had been refused. A stop by the budget after a refused answer now says
  why that answer was refused.

  Corrected after the independent review of 4553284 (P2-1): names in bold
  or italics ("**[a]** a **[b]**") and arrows or a double dash between two
  names ("->", "→", "--") are read as a range too. Run again on the five real
  summaries, this found three bold ranges in WI09's summary, the one behind
  the first Word report the owner judged (summary-neutral.docx), which the
  first pattern had let through.

  Not done: the summary's text is not changed otherwise (the owner judged it
  good; its comments change only where it names better images); the frames
  kept by the extraction are not changed; no new request or model is added.

  Known limitations: only the range is checked by the code. Whether the
  summary leaves out navigation and detours, names one frame per thing
  shown and picks the best one is asked of Gemini, not checked; the real run
  measures it on the owner's five cases, and a second meeting is not
  measured. The range pattern reads Spanish and English connectors on one
  line; a range written across two lines, with other text between a name and
  the connector ("[a] (5:27) a [b]", "entre [a], y [b]", "between [a] and
  the [b]"), or in other words ("frames 48 on"), is not caught, and the
  report would show whatever frames are named (review P2-1). A sentence
  where "a" or "al" joins two frame names without meaning a range is refused
  too; if both answers do so, nothing is delivered and both are paid (P3-6).
  A stop by the budget now prints the refusal of the answer before, which
  for some checks includes up to 80 characters of the summary, client text
  that must be left out of any evidence, as when the second answer is
  refused (P3-4); after a refusal and then a network failure, it still names
  the refusal (P3-5). Found by the re-verification: names in bold and
  italics at once ("***[a]***") and the connectors "---", "=>" and "⟶" are
  not caught either; and WI09's summary, behind the owner's first Word
  report, is now refused, so that report cannot be built again from it.
lane: standard
