acceptance:
  - id: WI13-AC01
    description: >
      The request for every meeting type (and none), in Spanish and in
      English, carries the owner's rule for which frames to name once,
      before the sections, and the guide of the on-screen section points to
      it and no longer asks for each relevant frame.
  - id: WI13-AC02
    description: >
      A summary naming two frames as a range is retried once and then
      refused, naming the range, and nothing is written; after a range, a
      summary naming each frame on its own is delivered; two frames named
      one after the other are not a range; the report refuses to build from
      a range and writes nothing; on the same cases the summary's check and
      the report's agree.
  - id: WI13-AC03
    description: >
      Applied without any request to the five real summaries in the owner's
      data folder, by a committed script, the check refuses the four that
      name ranges (one of them, as before, also for a frame that does not
      exist) and accepts the one that does not.
  - id: WI13-AC04
    description: >
      One real run on the owner's meeting of D-167, requirements type, in
      Spanish, with his paid key (budget: US$0.15 approved; the first
      run spent about US$0.05 and stopped before its retry; the owner then
      said a cap must not stop a needed document, INGOL D-182, and the run
      was made again with the ceiling of D-173, US$0.50), reusing the frames
      and their reading from D-178's run (copied into a new folder in his
      data folder, so they are not paid again and his earlier summaries stay
      as they are), and the Word report built from it. Passes only if none
      of the owner's five cases comes back: the file explorer (5:30) and the
      Outlook invitation (26:09) not named, not both 31:41 and 31:47, the
      transition at 1:01:34 not named, and no range. Recorded under
      docs/evidence/01M3MMR14T1PS5C4NVGZQW0K7W/ as numbers and frame minutes
      only. The owner judges the images of the new report.
  - id: WI13-AC05
    description: >
      The whole suite passes with `python -m unittest discover -s tests -v`
      in a fresh clone of the tested commit on the owner's machine, and its
      complete output is committed under
      docs/evidence/01M3MMR14T1PS5C4NVGZQW0K7W/ before the pull request
      (INGOL D-163).
