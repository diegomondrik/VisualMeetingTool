schema_version: "1"
id: 01M3JS6BH8TTPN0C76NFB7E6N6
objective: >
  The summary reads the meeting according to its kind, and is written in the
  language asked for (INGOL decision D-178, approved on the proposal
  meeting-types-contract-proposal.md in INGOL's repository). It changes the
  summary of D-174; Gemini still writes it with the user's key.

  Three types are added. presale: the client's problems, stated and implied;
  who decides; urgency; objections; alternatives; fit with what is offered;
  the next step. negotiation: the offered scope; price and terms; objections
  still open; what is missing to sign and who has to give it. requirements
  (the discovery of a project to be built): how the client works today; what
  they need; data and systems; users; rules and constraints; and what is
  still to be found out and whom to ask. Each of the three changes the
  request for the whole summary, not only adds sections at its end: a stance
  paragraph before the sections, new guides for some standard sections (in a
  presale, interest is a signal and not a decision; in a negotiation, the
  decisions are what was agreed on each side and how firmly; in a
  requirements meeting, the pending items are mostly what is still to be
  found out, and a need is a requirement, not a decision), and their own
  sections right after the participants. kickoff, status, technical and
  training stay exactly as they were, sections, place and guides.

  The original's discovery type, which joined presales and requirements
  gathering and in practice read as a presale, is retired: a new summary
  cannot take it and is told to use presale or requirements; a meeting stored
  in a project with it is still listed and read into the next summary, with a
  note saying what the old type covered.

  The language is Spanish or English, asked for apart from the meeting's (by
  default the transcript's). Verbatim quotes stay in the language they were
  said, in quotation marks, with a translation. Today only the headings are
  checked; now the text is too: counting the common words of each language,
  leaving quoted text out, a summary whose text is not mostly in the language
  asked for, or a section with at least 8 common words of the other language
  and more than twice as many as of its own, is refused like a missing
  section: retried once, then an error, and nothing is written or added.

  Not done, by D-178: other languages, guessing the type, types defined by
  each company. The Word report of D-177 is not changed; it reads the new
  headings as it reads any heading.

  Known limitations: the language check counts about fifteen common words of
  each language, so it tells Spanish from English and nothing else; a short
  section, or a section of names and figures, is never judged; a quote not
  in quotation marks counts as text. Whether each type's stance really
  changes what Gemini writes is judged by the owner on the real run, not by
  a test.
lane: standard
affected_surfaces:
  - .ingol/work-items/01M3JS6BH8TTPN0C76NFB7E6N6/**
  - docs/evidence/01M3JS6BH8TTPN0C76NFB7E6N6/**
