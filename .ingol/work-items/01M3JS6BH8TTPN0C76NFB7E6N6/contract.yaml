  - tests/test_summary.py
  - README.md
acceptance:
  - id: WI12-AC01
    description: >
      presale, negotiation and requirements ask for their own sections, in
      Spanish and in English, placed after the participants, and a summary
      missing any of them is retried once and refused, with nothing written;
      no type, kickoff, status, technical and training keep their sections,
      their place and their guides as before.
  - id: WI12-AC02
    description: >
      Each of the three new types changes the request for the whole summary:
      its stance comes before the sections, the guide of the decisions is
      different for each of them and for no type, and in a requirements
      meeting the executive summary and the pending items are about what is
      still unknown.
  - id: WI12-AC03
    description: >
      A meeting stored in a project with the retired discovery type is still
      listed and read into the next summary, with a note saying what the old
      type covered; a new summary cannot take the retired type, is told what
      replaces it, and sends nothing.
  - id: WI12-AC04
    description: >
      The language asked for wins over the meeting's; a summary in the other
      language, even with the right headings, or with one section in the
      other language, is retried once and refused, naming the language or
      the section, and nothing is written or added; quotes in the other
      language, and a few words of it in a section, are accepted; without a
      language, the transcript's is used.
  - id: WI12-AC05
    description: >
      With a type and a language, the key appears in no output, request body
      or file, and the same spend budget applies: a request that could go
      over it is not sent.
  - id: WI12-AC06
    description: >
      One real run on the owner's meeting of D-167 (INGOL D-167), on his
      machine, with his paid key: four summaries (presale, negotiation and
      requirements in Spanish, and requirements in English), with a budget of
      US$0.50 in total, each run given what is left of it. The frames read by
      WI09's run are reused, so they are not paid again. Recorded under
      docs/evidence/01M3JS6BH8TTPN0C76NFB7E6N6/ as numbers only. The owner
      reads the four summaries in his data folder, outside any repository,
      and judges whether the reading changes; they are deleted when he says.
      At the owner's request (session 114), the Word report is built from the
      requirements summary, since he reads the meeting as the discovery of a
      project.
  - id: WI12-AC07
    description: >
      The whole suite passes with `python -m unittest discover -s tests -v`
      in a fresh clone of the tested commit on the owner's machine, and its
      complete output is committed under
      docs/evidence/01M3JS6BH8TTPN0C76NFB7E6N6/ before the pull request
      (INGOL D-163).
