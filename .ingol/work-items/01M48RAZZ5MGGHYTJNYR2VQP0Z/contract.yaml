acceptance:
  - id: WI23-AC01
    description: >
      Every allowed field is accepted in a template (one test each, in the
      simple and the complex form) and its report builds; the report the
      application writes, the example template and a copy of the shape of
      the owner's template pass.
  - id: WI23-AC02
    description: >
      Fields outside the list are refused naming them, at the template and
      at the report's last check: every field WI22 refused, plus ADDIN,
      FILLIN, MERGEFIELD, ASK, QUOTE, AUTOTEXT, EMBED and a made-up name; in
      the forms of WI22-AC02.
  - id: WI23-AC03
    description: >
      Mutations: a name added to the list, the list check switched off, the
      list compared without the WI22 rule of the written-out name; each
      makes a test fail. The script and its output are in the evidence.
  - id: WI23-AC04
    description: >
      An independent review through INGOL's mailbox before the pull request;
      the whole suite passes with `python -m unittest discover -s tests -v`
      in a fresh clone of the tested commit with INGOL's kits on the import
      path, its output committed under
      docs/evidence/01M48RAZZ5MGGHYTJNYR2VQP0Z/; WI22-P3-5 becomes "fixed"
      and the register reproduces; tests changed are named with why.
