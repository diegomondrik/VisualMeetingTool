schema_version: "1"
id: 01M4BGTP1940T4ASG54GC323WT
objective: >
  WI26. A text transcript is read the same whatever the encoding Windows
  saved it in (finding R06, P1, of the external review of 2026-10-02: "Un
  TXT UTF-8 con BOM pierde la primera intervención sin advertencia"; already
  in the limitations register as WI05-P3-2). Last work item of the first
  batch, approved by the owner on 2026-10-07; starts from main (41f6722, after WI25); does not touch the
  installer's branch.

  Today a .txt transcript is read as UTF-8: a file saved with the byte
  order mark (BOM) that Notepad and many tools write keeps an invisible
  character before its first line, so the first timed line is not seen and
  the first turn disappears without a word (with one turn only, the file is
  refused as having no timed line). A file saved as UTF-16 (what Windows
  PowerShell 5.1 writes) or in the Western Windows code page (cp1252) is
  refused. After this work item: the BOM of UTF-8 and of UTF-16 (both byte
  orders) says the encoding; a file with no BOM is read as UTF-8, and if it
  is not valid UTF-8, as cp1252 (the encoding of a Windows in Spanish or
  English); Windows and Unix line endings alike. A line with a long run of
  spaces no longer takes seconds to read (the speaker-and-time pattern
  backtracks: 20,000 spaces took about 6 s).

  The tests that show the defect come from INGOL's pilot package, failing
  on 03b8573: the class TranscripcionDeTexto of test_d1_barrido.py (the BOM,
  UTF-16 and cp1252, and the long run of spaces), copied unchanged; it needs
  the kits.

  Built by a construction-role agent (Sonnet), gated by the criterion; one
  independent review through INGOL's mailbox.

  Not done: other encodings (a file that is neither UTF-8, UTF-16 nor
  cp1252 is read as cp1252, which may misread its accents); the second
  batch.
lane: standard
affected_surfaces:
  - .ingol/work-items/01M4BGTP1940T4ASG54GC323WT/**
  - docs/evidence/01M4BGTP1940T4ASG54GC323WT/**
