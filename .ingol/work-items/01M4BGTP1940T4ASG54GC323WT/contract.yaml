  - tests/**
  - README.md
acceptance:
  - id: WI26-AC01
    description: >
      TranscripcionDeTexto from INGOL's pilot package is in
      tests/test_d1_barrido.py, its code unchanged (checked by a script in
      the evidence), and its three tests pass with the kits.
  - id: WI26-AC02
    description: >
      Without the kits too (what the CI runs): the same transcript saved as
      UTF-8, UTF-8 with BOM, UTF-16 LE and BE with BOM, and cp1252, each
      with Windows and Unix line endings, in the three shapes the
      application reads (Teams with names, [HH:MM:SS], time alone), gives
      the same turns from both readers, the first turn included; with one
      timed line only, it is read, not refused; a line of 20,000 spaces is
      read in under a second.
  - id: WI26-AC03
    description: >
      Mutations (the BOM kept; UTF-16 not detected; no cp1252 fallback; the
      backtracking pattern back) each make a test fail; the script and its
      output in the evidence. WI05-P3-2 becomes "fixed". An independent
      review through INGOL's mailbox before the pull request; the whole
      suite passes in a fresh clone of the tested commit with INGOL's kits,
      output committed under docs/evidence/01M4BGTP1940T4ASG54GC323WT/;
      tests changed named with why; known limitations reproduced.
