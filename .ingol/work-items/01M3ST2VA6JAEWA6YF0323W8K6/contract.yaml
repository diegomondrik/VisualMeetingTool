acceptance:
  - id: WI16-AC01
    description: >
      With a template whose cover has the five fields (Spanish and English
      names), the report's cover has the meeting's client, project, title,
      date and type, the date written in the report's language, in Spanish
      and in English; fields in a header or footer are filled too; a meeting
      with no project leaves client and project empty; the fields keep the
      template's formatting.
  - id: WI16-AC02
    description: >
      A field split by Word across runs (for example "{", "cli", "ente}", each
      with its own formatting) is filled, and the paragraph's other text stays
      as it was.
  - id: WI16-AC03
    description: >
      A known field left in the finished document stops it: a build whose
      filling is broken on purpose is not delivered and names the field; an
      unknown field ({clinte}) is refused when the template is set, naming it
      and the known ones.
  - id: WI16-AC04
    description: >
      What the template has after its table of contents, or after {informe},
      is not in the report; a copy of the owner's template's shape (cover, a
      table of contents with its saved entries, a page of model with headings)
      invented at test time gives cover, table of contents and the report, and
      none of the model's text; a table of contents inside a content control
      is found too.
  - id: WI16-AC05
    description: >
      The table of contents lists exactly the report's headings, in order and
      within the field's levels, each linking to a bookmark on its heading; it
      remains a TOC field Word can update; the document does not ask Word to
      update fields when it opens. The owner opens one in Word.
  - id: WI16-AC06
    description: >
      The completeness check cannot be fooled by the table of contents: a
      report whose body lacks a section that the table of contents still
      lists is not delivered; a table of contents that does not list exactly
      the report's headings is not delivered.
  - id: WI16-AC07
    description: >
      The settings screen and template show give the real name (.docx or
      .dotx) and the date it was set, the fields found, whether there is a
      table of contents and how many paragraphs of model are dropped; a
      template kept before this work item says its name was not recorded;
      remove removes the record too.
  - id: WI16-AC08
    description: >
      The example template downloads from the settings screen and is written
      by template example; it can be set, and a report built with it has the
      five fields filled and a table of contents.
  - id: WI16-AC09
    description: >
      A template with no fields and no table of contents gives the report it
      gave before (its page as the cover); with no template, or with
      --neutral, the design is neutral as before; the WI11 template tests keep
      passing unchanged.
  - id: WI16-AC10
    description: >
      Real run, at no cost: the Word report of the BumbleBee meeting, built
      again from the command line with the owner's template after he writes
      the fields in it; recorded under
      docs/evidence/01M3ST2VA6JAEWA6YF0323W8K6/ as numbers only (fields
      filled, table of contents entries, paragraphs dropped, images, size,
      seconds). The owner opens it and says whether it is fit to send.
  - id: WI16-AC11
    description: >
      The whole suite passes with `python -m unittest discover -s tests -v`
      in a fresh clone of the tested commit on the owner's machine, and its
      complete output is committed under
      docs/evidence/01M3ST2VA6JAEWA6YF0323W8K6/ before the pull request
      (INGOL D-163). The one existing assertion changed is the settings
      test's expectation of the kept copy's name, which is what AC07 fixes.
