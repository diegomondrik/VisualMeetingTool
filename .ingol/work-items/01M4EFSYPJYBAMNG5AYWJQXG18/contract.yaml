acceptance:
  - id: WI33-AC01
    description: >
      docs/manual/user-manual.html exists, is English, needs nothing from
      outside, has the twelve sections above in order with a contents list
      whose links work, and follows the system theme and prints; tests read
      the page and say so.
  - id: WI33-AC02
    description: >
      The installer installs it at manual\user-manual.html next to the program,
      adds a Start menu entry in the installer's language (Spanish and English)
      and offers to open it unticked; the build produces the installer with it
      and the installer's file list, as built, shows it (output committed as
      evidence). The existing test that said every shortcut opens the program
      is changed to name the manual's entries, with why.
  - id: WI33-AC03
    description: >
      The manual is tied to the program: every quoted name is in the program's
      English texts, the numbers are the code's, the places it names are the
      program's, and it quotes no price and promises no guarantee; mutations
      (a name renamed in the manual; a limit changed; a section removed; the
      installer's manual entry removed; the manual's offer ticked) each make a
      test fail, the script and its output in the evidence. An independent
      review through INGOL's mailbox that reads the manual against the program
      and checks that nothing in it is false or would mislead a new user; the
      whole suite passes in a fresh clone of the tested commit with INGOL's
      kits, output committed under docs/evidence/01M4EFSYPJYBAMNG5AYWJQXG18/; tests changed named with
      why.
