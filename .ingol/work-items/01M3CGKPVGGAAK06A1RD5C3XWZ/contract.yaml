  - tests/test_frames.py
  - pyproject.toml
acceptance:
  - id: WI04-AC01
    description: >
      `python -m meetingtool.frames` extracts frames from a recording using
      PyAV, with no ffmpeg executable reachable: a test runs it in a child
      process whose PATH contains no ffmpeg and requires frames to be
      written.
  - id: WI04-AC02
    description: >
      On a synthetic recording built at test time (distinct slides held for
      several seconds, repeated slides, and changes confined to the top
      camera strip), the selection keeps a frame for the opening slide and
      for each slide change,
      ignores changes inside the camera strip, respects the minimum gap and
      the budget, and drops a repeated slide identical to the last kept
      frame; the structural-similarity function returns 1 for identical
      images and less for different ones.
  - id: WI04-AC03
    description: >
      Kept frames are JPEG files no larger than 1280x720 named
      frame_NNN_tHH-MM-SS.jpg in time order; a discard log names every
      discarded sample's time and reason; no more than `budget` candidates
      are held at any moment; and the output folder is refused, before
      anything is written, when it is inside a git work tree.
  - id: WI04-AC04
    description: >
      Extraction makes no network connection: a test replaces socket
      creation with one that fails and requires extraction to succeed
      (WI028-AC04).
  - id: WI04-AC05
    description: >
      One run on a real meeting recording on the owner's machine, output
      outside any repository, recorded under
      docs/evidence/01M3CGKPVGGAAK06A1RD5C3XWZ/ as numbers only (duration,
      samples analysed, frames kept, discards by reason, seconds taken, peak
      memory), with no image, file name or content of the meeting; the
      frames written are deleted after counting (WI028-AC04).
  - id: WI04-AC06
    description: >
      `pyproject.toml` declares av, numpy and pillow as dependencies and
      finds every `meetingtool` subpackage; a test reads it and checks both.
  - id: WI04-AC07
    description: >
      The whole suite passes with `python -m unittest discover -s tests -v`
      in a fresh clone of the tested commit on the owner's machine, and its
      complete output is committed under
      docs/evidence/01M3CGKPVGGAAK06A1RD5C3XWZ/ before the pull request
      (INGOL D-163).
