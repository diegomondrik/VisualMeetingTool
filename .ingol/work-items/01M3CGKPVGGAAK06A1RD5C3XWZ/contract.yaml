schema_version: "1"
id: 01M3CGKPVGGAAK06A1RD5C3XWZ
objective: >
  Work 2 of INGOL WI-028 (decision D-162): extract and select the images of
  a meeting recording with nothing installed beside the Python packages.
  The original MeetingTool needed ffmpeg installed on the machine, one of
  the owner's complaints. This work item adds a `meetingtool.frames`
  package that decodes the recording with PyAV (which bundles FFmpeg), and
  ports the original selection algorithm: sample the video, score every
  sample against the previous one by zone change, edge change and time
  coverage, ignore the camera strip at the top, keep a minimum gap, apply
  a budget by score, drop near-duplicates by structural similarity, and
  save the kept frames as JPEG no larger than 1280x720 with a log of what
  was discarded and why.

  Three changes from the original: memory stays bounded (only the best
  `budget` candidates are kept, as compressed JPEG, instead of every
  candidate as a full-size image); structural similarity is computed with
  numpy instead of scikit-image, so no further library is needed; and the
  near-duplicate check compares
  the content area only, below the camera strip, as the scoring already
  did (the original compared whole frames, so a camera-strip change alone
  could keep a duplicate slide).
  Reading the images with an AI service, and the transcript boost, are not
  part of this work item.

  Frames of a real meeting are client data and this repository is public:
  the output folder is refused inside any git work tree, tests build their
  video synthetically at run time and commit no media (finding P2-A of the
  guard's review), and a real run on the owner's machine records only
  numbers. `pyproject.toml` declares the three runtime packages and finds
  subpackages, so an install carries `meetingtool.frames` (and any other
  subpackage).

  This work item runs in parallel with work 1 (projects and meeting memory,
  01M3CGKPV51VTTK3S8V1JEF4HW) and touches none of its files (condition 7 of
  INGOL's dogfooding gate, WI028-AC07).
lane: standard
affected_surfaces:
  - .ingol/work-items/01M3CGKPVGGAAK06A1RD5C3XWZ/**
  - docs/evidence/01M3CGKPVGGAAK06A1RD5C3XWZ/**
