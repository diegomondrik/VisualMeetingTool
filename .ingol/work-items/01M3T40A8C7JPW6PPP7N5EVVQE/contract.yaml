schema_version: "1"
id: 01M3T40A8C7JPW6PPP7N5EVVQE
objective: >
  The company and the language of the application (INGOL D-188, approving
  docs/work-items/f8-owner-project/brand-language-word-proposal.md of INGOL).
  WI17 of the sequence that finishes MeetingTool; it starts once WI16 is
  integrated (VisualMeetingTool PR #17, a2b98aa). The installer is WI18 and
  the guide WI19.

  The company that owns the installation. In Settings, the company's name
  and logo. They appear at the top of every screen, next to "MeetingTool",
  and in the tab's name. Without a name or logo everything stays as today.
  The logo is a PNG or JPG of at most 1 MB, and a real image of that kind:
  the file is decoded, not trusted by its name, and what is kept is the image
  written again, so nothing hidden in the file travels with it. An SVG is
  refused, because an SVG can carry code that would run inside the
  application. The name is shown as text, never as markup.

  The language of the application. In Settings, Spanish or English; Spanish
  until someone changes it. It changes everything the application says:
  menus, titles, buttons, instructions, button notices, the progress of each
  stage and the error messages of every stage (frames, reading, summary,
  questions and answers, Word report, projects), which today come out in
  English. It is independent of the summary's language: someone using the
  application in Spanish can still ask for an English summary.

  One list of messages. Every text the application shows and every error the
  program raises is an entry of one list, with its text in each language and
  the data it carries by name (the file, the amount...). A new language is a
  new file of that list; nothing else is rewritten. An error raised with
  text written anywhere else makes the tests fail.

  What stays in its language, and why. The terminal commands keep speaking
  English, exactly as today: they are for whoever maintains the program. A
  message that comes from outside (an error of Google, of the system, of a
  library) cannot be translated beforehand: the application shows a sentence
  in the chosen language saying what happened and what to do, and the
  original text below it, as a detail.

  Not done (D-188): other languages (the list is ready for one, none is
  added); translating the terminal; the logo inside the Word report (the
  template carries it); the installer (WI18) and its window (D-187); the
  guide (WI19).

  Corrected after the independent review of 5d4c63a and its re-verification
  (docs/evidence/01M3T40A8C7JPW6PPP7N5EVVQE/independent-review.md): a logo
  refused for being over 1 MB is read before the answer, so the page gets the
  reason instead of a cut connection (P1-1: the suite failed one run in three
  on Windows); a request refused before the session sees neither the
  company's name nor its logo (P2-1); the checks of AC03 and AC06 read texts
  between single quotes and backquotes, a button's value, the settings'
  other branches, and every error of the program made, raised at once or not
  (P2-2, P2-3); the logo keeps only its pixels and its transparent colour,
  no colour profile, text or metadata (P2-4); a detail carries no memory
  address (P3).

  Known limitations (independent review): text put by hand in a JSON answer
  of the server or in a job's error, without an error of the program, is
  seen by no control unless a test goes through that path; a text in a
  branch no test shows, or built by joining pieces in the page's script, can
  escape the screens' check; an error of the program given text that is not
  an entry says it as it is (the tests use that to stand in for a failure);
  a logo of more than 32 MB still gets a cut connection; the settings show a
  template that can no longer be used without its detail; a language request
  without a language says "None"; data given with a Message to Failure is
  ignored.
lane: standard
affected_surfaces:
  - .ingol/work-items/01M3T40A8C7JPW6PPP7N5EVVQE/**
  - docs/evidence/01M3T40A8C7JPW6PPP7N5EVVQE/**
