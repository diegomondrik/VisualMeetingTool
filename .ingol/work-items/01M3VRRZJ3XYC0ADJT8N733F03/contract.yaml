acceptance:
  - id: WI18-AC01
    description: >
      Opened in its own window, every screen and every action works as in the
      browser: uploading a recording, a transcript, a template and a logo;
      downloading the example template; opening the Word report.
  - id: WI18-AC02
    description: >
      Closing with the X while a meeting is processed asks first; confirmed,
      nothing is left half done; refused, the processing goes on; with
      nothing being processed it closes without asking.
  - id: WI18-AC03
    description: >
      A second start on the same data folder does not start another
      application; it says so in the application's language.
  - id: WI18-AC04
    description: >
      The protections of today hold: a request from another machine or from
      another page is refused, also with the window open; the tests of WI15
      pass unchanged.
  - id: WI18-AC05
    description: >
      The installer is built from the code with one command in a fresh clone;
      its output and the size of the .exe are committed as evidence.
  - id: WI18-AC06
    description: >
      The installer asks for its language first (Spanish or English) and stays
      in it, uninstalling included; the installed application starts in that
      language; a language already chosen in Settings is kept.
  - id: WI18-AC07
    description: >
      On a clean machine (Windows Sandbox): installing without administrator
      rights, opening, processing at no cost, closing with the X during a
      processing, installing again over it and uninstalling, without losing
      the data; what the Windows antivirus said is recorded.
  - id: WI18-AC08
    description: >
      Real run, only if the owner asks for it: a short meeting processed on the
      clean machine with the owner's key, typed by the owner, ceiling US$1.00,
      Word report opened; the owner says whether it is understood.
  - id: WI18-AC09
    description: >
      Without the installer everything stays as it is: the commands and
      `python -m meetingtool app` do what they do today; the whole suite
      passes with `python -m unittest discover -s tests -v` in a fresh clone
      of the tested commit on the owner's machine, and its complete output is
      committed under docs/evidence/01M3VRRZJ3XYC0ADJT8N733F03/ before the
      pull request (INGOL D-163).
