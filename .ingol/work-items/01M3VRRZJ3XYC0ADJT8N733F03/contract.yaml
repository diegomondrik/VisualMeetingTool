schema_version: "1"
id: 01M3VRRZJ3XYC0ADJT8N733F03
objective: >
  The Windows installer of VisualMeetingTool (INGOL D-185, renumbered WI18 by
  D-188; its own window by D-187). Approved by the owner ("dale", 2026-10-01)
  on docs/proposals/wi18-installer-proposal.md of this repository, with the
  language of the installer added at the owner's request before approving.
  The proposal is the authority for anything this text summarises. INGOL's
  ledger is not written by this line of work (INGOL D-179, D-189).

  What it delivers. VisualMeetingTool-Setup-<version>.exe, published on the
  repository's releases page. Double-clicked, it first asks in which language
  the installer is to be read (Spanish or English), and stays in that
  language, uninstalling included. It installs for the current user only,
  without administrator rights, with a Start-menu shortcut and an optional
  desktop one. Python is not needed: the program carries it.

  The window (D-187). The installed application opens its own window, with
  the screens of WI15 to WI17 inside, through the web component that
  Windows 11 already has (WebView2): no browser, no tab, no terminal. It is
  closed with the X; if a meeting is being processed it asks first, and if
  the answer is yes the meeting is dropped leaving nothing half done. Every
  action of the screens works in it: uploading a recording, a transcript,
  a template and a logo; downloading the example template; opening the Word
  report. The server inside keeps every protection it has today: it listens
  on this machine only and needs its session token, which only the window
  gets. A second start on the same data folder does not start a second
  application: it says so and stops.

  The language. The installed application starts in the language chosen for
  the installer. It is the default only: it is changed in Settings as
  today, and a language already chosen in Settings wins over the
  installer's. The summary's language stays separate.

  The data stay outside the program, in the user's data folder as today:
  uninstalling removes the program and not the data; installing a new
  version over it keeps the data and the Gemini key. The installer never
  carries a Gemini key.

  The recipe. One command builds the installer from the code on a machine
  with the build tools, whose versions are pinned in the repository. The
  tools are free: PyInstaller, pywebview and Inno Setup.

  Not done (proposal): the guide (WI19); signing the program (Windows warns
  about an unsigned program the first time); automatic updates (a new
  version is installed by running its installer over the old one); Mac,
  Linux and Windows 10; any change in what the application does or how it
  processes a meeting; `python -m meetingtool app` keeps opening the browser
  (D-187). Whether each person uses their own Gemini key or a shared one is
  left to WI19: the installer carries none in either case.

  Authorised beyond D-100/D-107 by the same "dale" (the proposal's
  authorisation block): installing the build tools on the owner's machine,
  and publishing the first release with the installer attached on this
  public repository once integrated. One real run on the clean machine with
  the owner's key, ceiling US$1.00, only if the owner asks for it.

  The clean machine (AC07). Windows Sandbox, named by the proposal, cannot
  run WebView2 on Windows 11 24H2: it is registered there but cannot start,
  and installing it inside fails as well (MicrosoftEdge/WebView2Feedback
  #5697; docs/evidence/01M3VRRZJ3XYC0ADJT8N733F03/clean-machine-sandbox-attempt.txt).
  The test is run, as the proposal's alternative, on the computer of a
  member of the owner's team that never had VisualMeetingTool. Because of
  the sandbox, the window now says at once when WebView2 cannot start, how
  to repair it and where its log is (window.log).

  Corrected after the independent review of 1a4bd76
  (docs/evidence/01M3VRRZJ3XYC0ADJT8N733F03/independent-review.md): a % in
  installation.ini no longer stops the application (P2-1); the build refuses
  files git ignores inside what it packs, so that client data cannot be
  published in the installer (P2-2); a test that the run itself holds the
  saving the window waits for (P2-3); Internet Explorer's component instead
  of WebView2 is said (P3-1); the token is hidden in a trace too (P3-2); the
  closing question says that a meeting being saved is saved whole (P3-3);
  tests of the build's refusals and of the window closing the runner (P3-4,
  P3-5). Every new control is shown able to fail (mutations.txt).

  Known limitations: the release of the saving lock in its nested finally
  has no test; the versions of Inno Setup and Python are printed by the
  build but not checked against a pin; installing over an older version
  leaves the files it no longer has; window.log stays after uninstalling;
  the program has no icon of its own (the window and the shortcuts show
  PyInstaller's default one); the
  behaviour of WebView2 itself (downloads, the save dialog, the closing
  question) is shown only by the clean-machine run, not by the tests.
