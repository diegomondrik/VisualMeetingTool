evaluations:
  - criterion: WI18-AC01
    method: external-evidence
    control: >-
      tests/test_window.py opens the window code with a fake webview and checks
      the address, the downloads setting and the WebView2 choice; the owner
      goes through every screen and action in the installed window.
  - criterion: WI18-AC02
    method: deterministic
    control: >-
      tests/test_window.py closes the window while a faked meeting is
      processed, answering yes and no, and with nothing being processed.
  - criterion: WI18-AC03
    method: deterministic
    control: >-
      tests/test_window.py starts the window twice on one data folder and
      reads the message of the second.
  - criterion: WI18-AC04
    method: adversarial
    control: >-
      The tests of the application's server pass unchanged, plus one that
      sends a request without the session while the window holds it.
  - criterion: WI18-AC05
    method: external-evidence
    control: >-
      python packaging/build.py in a fresh clone; its output and the .exe's
      size and SHA-256 committed.
  - criterion: WI18-AC06
    method: deterministic
    control: >-
      tests/test_window.py reads the installer's language file into the
      application's default language, and keeps a language chosen in Settings;
      the clean-machine run installs in English and again in Spanish.
  - criterion: WI18-AC07
    method: external-evidence
    control: >-
      The installer run in Windows Sandbox, step by step, with what happened
      written and screenshots, committed.
  - criterion: WI18-AC08
    method: external-evidence
    control: >-
      Numbers of the real run only (images, cost, time); the owner's judgement.
  - criterion: WI18-AC09
    method: deterministic
    control: >-
      python -m unittest discover -s tests -v in a fresh clone of the tested
      commit; complete output committed.
