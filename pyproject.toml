[project]
name = "meetingtool"
dynamic = ["version"]
description = "Turns a meeting recording and its transcript into a report with images."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
meetingtool = "meetingtool.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["meetingtool"]

[tool.setuptools.dynamic]
version = { attr = "meetingtool.__version__" }
