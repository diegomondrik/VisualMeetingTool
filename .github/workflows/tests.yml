name: tests

# The project's own tests, on every pull request to main (INGOL WI-029, D-190).
# Only pull_request: a push would run the project's code in the cache scope
# the INGOL wrapper restores from. The suite needs no Gemini key and reaches
# no network: Gemini is a fake on localhost, and one test checks that the
# real endpoint is never called. Windows, because the application is a
# Windows program (the Credential Manager, the data folder's lock).

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pull request
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      # The libraries of pyproject.toml, at the exact versions of
      # constraints.txt (the ones the installer packs), so that a release of
      # a library cannot change the result without a change of the program.
      - name: Install the libraries of pyproject.toml, pinned by constraints.txt
        run: python -m pip install -c constraints.txt "av>=14" "numpy>=1.26" "pillow>=10" "python-docx>=1.1"

      - name: Show the versions installed
        run: python -m pip list

      - name: Run the whole suite
        run: python -m unittest discover -s tests -v
